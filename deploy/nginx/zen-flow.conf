# nginx site config for Zen-Flow on a Hostinger VPS.
#
# Install on the VPS host (not in the container):
#   sudo cp deploy/nginx/zen-flow.conf /etc/nginx/sites-available/zen-flow.conf
#   sudo ln -s /etc/nginx/sites-available/zen-flow.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then issue certificates:
#   sudo certbot --nginx -d getmindfulspace.com -d www.getmindfulspace.com
#
# certbot rewrites the :80 server block to redirect to :443 and fills in the
# ssl_certificate paths below.
#
# The Node container already serves the frontend from dist/public and the API
# under /api, so nginx only needs to proxy. Do not add a `root` directive.

upstream zen_flow_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name getmindfulspace.com www.getmindfulspace.com;

    # certbot HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name getmindfulspace.com www.getmindfulspace.com;

    # Filled in by certbot --nginx
    # ssl_certificate     /etc/letsencrypt/live/getmindfulspace.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/getmindfulspace.com/privkey.pem;

    client_max_body_size 2m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://zen_flow_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Long-lived caching for content-hashed Vite assets.
    location /assets/ {
        proxy_pass http://zen_flow_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health endpoint stays JSON and is never cached.
    location = /api/healthz {
        proxy_pass http://zen_flow_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        access_log off;
        add_header Cache-Control "no-store" always;
    }
}
