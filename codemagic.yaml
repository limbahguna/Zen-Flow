workflows:
  ios-simulator:
    name: Mindful Space iOS Simulator
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: 16.0
      node: 24.13.0

    scripts:
      - name: Install pnpm
        script: |
          npm install -g pnpm@10.26.1

      - name: Install project dependencies
        script: |
          pnpm install --frozen-lockfile

      - name: Add iOS platform if needed
        script: |
          if [ ! -d "artifacts/mindful-productivity/ios" ]; then
            cd artifacts/mindful-productivity
            pnpm exec cap add ios
          fi

      - name: Build web app and sync iOS
        script: |
          pnpm --dir artifacts/mindful-productivity run ios:prepare

      - name: Install CocoaPods dependencies
        script: |
          cd artifacts/mindful-productivity/ios/App
          pod install

      - name: Build unsigned iOS Simulator app
        script: |
          cd artifacts/mindful-productivity/ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/*.app
