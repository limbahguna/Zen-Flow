<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — KindEase</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1A1E1A;
      color: #C8D5B9;
      font-family: 'DM Sans', -apple-system, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .icon-wrap {
      width: 96px;
      height: 96px;
      background: #2F4236;
      border-radius: 21px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.28);
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #E8EDE3;
      margin-bottom: 12px;
      text-align: center;
    }

    p {
      font-size: 15px;
      color: #A3B197;
      text-align: center;
      line-height: 1.6;
      max-width: 320px;
      margin-bottom: 32px;
    }

    button {
      background: #4A5D3E;
      color: #E8EDE3;
      border: none;
      border-radius: 12px;
      padding: 0 28px;
      height: 48px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #6B8C5A; }

    /* Breathing animation */
    .breath-wrap {
      position: fixed;
      inset: 0;
      background: #1A1E1A;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }
    .breath-wrap.active { display: flex; }

    .circle {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: #2D3A2E;
      animation: breathe 11s ease-in-out infinite;
    }
    @keyframes breathe {
      0%   { transform: scale(0.75); }
      36%  { transform: scale(1.7); }  /* inhale 4s */
      64%  { transform: scale(1.7); }  /* hold 3s */
      100% { transform: scale(0.75); } /* exhale 4s */
    }

    .breath-label {
      font-size: 20px;
      font-weight: 700;
      color: #E8EDE3;
    }
    .breath-sub { font-size: 13px; color: #7A8A72; }

    .back-btn {
      background: transparent;
      color: #5A6A52;
      border: none;
      font-size: 14px;
      cursor: pointer;
      padding: 8px 16px;
      border-radius: 8px;
    }
    .back-btn:hover { color: #A3B197; background: transparent; }
  </style>
</head>
<body>

  <div id="main">
    <div class="icon-wrap" role="img" aria-label="KindEase">
      <svg width="67" height="67" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="offline-wave" x1="150" y1="0" x2="874" y2="0" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#EFE7D6"/>
            <stop offset="0.5" stop-color="#EFE7D6"/>
            <stop offset="0.62" stop-color="#8FA889"/>
            <stop offset="1" stop-color="#8FA889"/>
          </linearGradient>
        </defs>
        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="512" cy="512" r="312" stroke="#EFE7D6" stroke-width="44" stroke-opacity="1"/>
          <path d="M150 556 C205 556 228 498 290 498 C365 498 392 604 452 604 C522 604 578 424 664 424 C742 424 784 548 874 548" stroke="url(#offline-wave)" stroke-width="52" stroke-opacity="1"/>
        </g>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>Don't worry — your breathing exercises still work offline. Reconnect to sync your data.</p>
    <button onclick="startBreathing()">Try Breathing Exercise</button>
  </div>

  <div class="breath-wrap" id="breathing">
    <div class="circle"></div>
    <div>
      <div class="breath-label" id="phase-label">Breathe in...</div>
      <div class="breath-sub" style="text-align:center;margin-top:4px">4-7-8 breathing</div>
    </div>
    <button class="back-btn" onclick="stopBreathing()">← Back</button>
  </div>

  <script>
    const PHASES = [
      { label: 'Breathe in...', duration: 4000 },
      { label: 'Hold...', duration: 7000 },
      { label: 'Breathe out...', duration: 8000 },
    ];
    let phaseIdx = 0;
    let timer = null;

    function nextPhase() {
      phaseIdx = (phaseIdx + 1) % PHASES.length;
      document.getElementById('phase-label').textContent = PHASES[phaseIdx].label;
      timer = setTimeout(nextPhase, PHASES[phaseIdx].duration);
    }

    function startBreathing() {
      document.getElementById('main').style.display = 'none';
      document.getElementById('breathing').classList.add('active');
      document.getElementById('phase-label').textContent = PHASES[0].label;
      timer = setTimeout(nextPhase, PHASES[0].duration);
    }

    function stopBreathing() {
      clearTimeout(timer);
      document.getElementById('breathing').classList.remove('active');
      document.getElementById('main').style.display = '';
    }
  </script>
</body>
</html>
