kind = "web"
previewPath = "/"
title = "Mindful Productivity"
version = "1.0.0"
id = "artifacts/mindful-productivity"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23942

[services.development]
run = "pnpm --filter @workspace/mindful-productivity run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mindful-productivity", "run", "build" ]
publicDir = "artifacts/mindful-productivity/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23942"
BASE_PATH = "/"
