# Optional Traefik attachment. Not used for the pre-DNS staging test.
#
# Usage (only after a hostname is ready — still do not change getmindfulspace.com DNS):
#   docker compose -f docker-compose.yml -f docker-compose.traefik.yml up -d
#
# Requirements on the VPS:
#   TRAEFIK_NETWORK  — existing Docker network Traefik is attached to
#                      (docker network ls; inspect a Traefik container)
#   TRAEFIK_HOST     — hostname this router should answer, not getmindfulspace.com
#                      until you deliberately cut DNS over
#   TRAEFIK_ENTRYPOINT — usually websecure
#   TRAEFIK_CERTRESOLVER — your existing Let's Encrypt resolver name, if any
#
# This file never publishes 80 or 443. Traefik keeps those ports.

services:
  app:
    networks:
      - mindful-space-internal
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK}
      - traefik.http.routers.mindful-space.rule=Host(`${TRAEFIK_HOST}`)
      - traefik.http.routers.mindful-space.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.mindful-space.tls=true
      - traefik.http.routers.mindful-space.tls.certresolver=${TRAEFIK_CERTRESOLVER}
      - traefik.http.services.mindful-space.loadbalancer.server.port=3000
      - traefik.http.services.mindful-space.loadbalancer.passHostHeader=true

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK}
