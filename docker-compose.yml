# Mindful Space (Zen-Flow) on a Hostinger VPS that already runs Traefik.
#
# Isolated Compose project: does not attach to Traefik, does not bind host
# ports 80 or 443, and uses unique container/image names so it cannot collide
# with hermes-agent-lupk or openclaw-oyz2.
#
# Staging (before DNS cutover): publish only on loopback and test via SSH
# tunnel. Do not install the nginx site in deploy/nginx/zen-flow.conf — Traefik
# already owns 80/443.
#
# Optional HTTPS via Traefik later:
#   docker compose -f docker-compose.yml -f docker-compose.traefik.yml up -d
# Only after a dedicated hostname exists. That overlay still does not bind 80/443.

name: mindful-space

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    image: mindful-space-app:latest
    container_name: mindful-space-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      # Loopback only. Never 80/443. Change HOST_PORT if 3010 is taken.
      - "127.0.0.1:${HOST_PORT:-3010}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - mindful-space-internal

networks:
  mindful-space-internal:
    name: mindful-space-internal
    driver: bridge
