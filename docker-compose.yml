# Mindful Space (Zen-Flow) on the Hostinger VPS.
#
# Isolated Compose project: unique container/image names so it cannot collide
# with Hermes, OpenClaw, or n8n. This file never publishes host ports 80 or 443.
# Loopback 127.0.0.1:3010 stays available for SSH-tunnel staging.
#
# Public HTTPS is the Caddy overlay (only that file binds 80/443):
#   docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d
# Do not install deploy/nginx/zen-flow.conf. Do not use docker-compose.traefik.yml
# on this host (no Traefik is running; 80/443 are reserved for Caddy).

name: mindful-space

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    image: mindful-space-app:latest
    container_name: mindful-space-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      # Loopback only. Never 80/443. Change HOST_PORT if 3010 is taken.
      - "127.0.0.1:${HOST_PORT:-3010}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - mindful-space-internal

networks:
  mindful-space-internal:
    name: mindful-space-internal
    driver: bridge
